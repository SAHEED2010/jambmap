<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMB Center Locator 2025</title>
    <meta name="description" content="Find 2025 JAMB Approved Registration Centers in Nigeria.">
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --surface-color: #ffffff;
            --text-color: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
            --shadow-sm: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: var(--surface-color);
            padding: 1rem 2rem;
            box-shadow: var(--shadow-sm);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Main Layout */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr;
            gap: 1rem;
            padding: 1rem;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            main {
                grid-template-columns: 400px 1fr;
                /* Sidebar List | Map */
                grid-template-rows: 1fr;
            }
        }

        /* Sidebar / List Section */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: var(--surface-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            height: 100%;
        }

        .search-container {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
        }

        .search-inputs {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
        }

        .results-info {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* Centers List */
        .centers-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .center-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .center-item:hover {
            background-color: #f1f3f4;
        }

        .center-item.active {
            background-color: #e8f0fe;
            border-left: 4px solid var(--primary-color);
        }

        .center-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text-color);
        }

        .center-location {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .actions {
            margin-top: 0.75rem;
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--primary-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #f1f3f4;
            border-color: var(--primary-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* Map Section */
        .map-container {
            background: var(--surface-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            position: relative;
            height: 100%;
            min-height: 400px;
            /* Mobile minimum height */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Mobile specific adjustments */
        @media (max-width: 767px) {
            body {
                height: auto;
                /* Allow body to grow on mobile */
                overflow-y: auto;
            }

            main {
                display: flex;
                flex-direction: column;
                /* Map on top visually, but DOM order matters? No, typically Map first on mobile is better or Search first? Let's do Search -> Map -> List */
                height: auto;
                overflow: visible;
            }

            .sidebar {
                height: 500px;
                /* Fixed height for list on mobile */
                order: 2;
            }

            .map-container {
                height: 300px;
                order: 1;
            }
        }

        /* Fallback / Empty State */
        .empty-state {
            padding: 2rem;
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
            JAMB Centers 2025
        </div>
        <!-- Share Button -->
        <button class="btn" onclick="shareApp()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                <polyline points="16 6 12 2 8 6"></polyline>
                <line x1="12" y1="2" x2="12" y2="15"></line>
            </svg>
            Share
        </button>
    </header>

    <main>
        <!-- Sidebar for Desktop, Bottom for Mobile -->
        <div class="sidebar">
            <div class="search-container">
                <div class="search-inputs">
                    <input type="text" id="searchInput" placeholder="Search center name, town..."
                        aria-label="Search centers" list="suggestions">
                    <datalist id="suggestions"></datalist>
                    <select id="stateFilter" aria-label="Filter by State">
                        <option value="">All States</option>
                        <!-- Options populated by JS -->
                    </select>
                </div>
                <div class="results-info" id="resultsInfo">Showing all centers</div>
                <small class="text-muted" style="display: block; margin-top: 0.5rem; color: var(--text-secondary);">
                    Tip: Search by name or town to find your center.
                </small>
            </div>

            <div id="centersList" class="centers-list">
                <!-- Items injected here -->
            </div>
        </div>

        <!-- Map Container -->
        <div class="map-container">
            <iframe src="https://www.google.com/maps/d/u/0/embed?mid=1P1KL7v8Qtgkuecy1wJbedEtusofljLg&ehbc=2E312F"
                title="JAMB Centers Map">
            </iframe>
        </div>
    </main>

    <script>
    </script>
    <script src="data.js"></script>
    <script>        // Data Parsing Logic
        function parseRawData(str) {
            console.log('Raw Data Length:', str.length);
            const lines = str.trim().split('\n');
            console.log('Total Lines:', lines.length);
            const parsed = [];

            lines.forEach((line, index) => {
                line = line.trim();
                if (!line || line.includes('JAMB | CMS')) return;

                // Debug first few lines
                if (index < 3) console.log(`Line ${index}:`, line);

                // Split by tabs or multiple spaces
                const parts = line.split(/\t/);

                // Fallback if tabs didn't work (length 1)
                if (parts.length < 2) {
                    // Try splitting by multiple spaces
                    const partsSpace = line.split(/\s{2,}/);
                    if (partsSpace.length > parts.length) {
                        // Use space split if it looks better
                        parts.length = 0;
                        parts.push(...partsSpace);
                    }
                }

                if (index < 3) console.log(`Parts ${index}:`, parts);

                // Heuristic for rows that have at least SN, State, Town, Name
                if (parts.length < 4) {
                    if (index < 10) console.warn(`Line ${index} skipped (parts < 4):`, parts);
                    return;
                }

                // Extra safety: first column must be number
                const sn = parseInt(parts[0]);
                if (isNaN(sn)) {
                    if (index < 10) console.warn(`Line ${index} skipped (NaN SN):`, parts[0]);
                    return;
                }

                const state = parts[1];
                const town = parts[2];

                // Coordinate extraction (check last tokens)
                let lat = null, lng = null;
                let name = parts[3]; // Default

                // Check if last parts are numbers
                const last = parseFloat(parts[parts.length - 1]);
                const secondLast = parseFloat(parts[parts.length - 2]);

                if (!isNaN(last) && !isNaN(secondLast)) {
                    lat = secondLast;
                    lng = last;
                    // Name is everything between Town and Lat/Lng
                    // We recreate the name from parts [3...length-2]
                    name = parts.slice(3, parts.length - 2).join(' ');
                } else {
                    // Try to clean up name if it has trailing garbage or repeated address
                    name = parts.slice(3).join(' ');
                }

                // Cleanup Name: Remove quotes and redundant text if possible
                if (name && name.startsWith('"') && name.endsWith('"')) {
                    name = name.slice(1, -1);
                }

                parsed.push({
                    sn: sn,
                    state: state,
                    town: town,
                    centre_name: name,
                    lat: lat,
                    lng: lng
                });
            });

            console.log('Parsed Count:', parsed.length);
            return parsed.sort((a, b) => a.state.localeCompare(b.state));
        }

        // Initialize with parsed data
        const rawData = parseRawData(rawDataString);



        // State
        let filteredData = [...rawData];

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const stateFilter = document.getElementById('stateFilter');
        const centersList = document.getElementById('centersList');
        const resultsInfo = document.getElementById('resultsInfo');

        // Initialize
        function init() {
            populateStates();
            renderList(filteredData);
            setupEventListeners();
        }

        // Populate State Dropdown and Suggestions
        function populateStates() {
            const states = [...new Set(rawData.map(item => item.state))].sort();
            states.forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                stateFilter.appendChild(option);
            });

            // Populate Suggestions
            const suggestions = document.getElementById('suggestions');
            const uniqueNames = [...new Set(rawData.map(item => item.centre_name))];
            const uniqueTowns = [...new Set(rawData.map(item => item.town))];

            // Limit suggestions to avoid DOM overload, or just add all (browser handles datalist reasonably well for < 1000 items)
            // Combined list
            const allSuggestions = [...uniqueNames, ...uniqueTowns].sort().slice(0, 2000);

            allSuggestions.forEach(val => {
                const option = document.createElement('option');
                option.value = val;
                suggestions.appendChild(option);
            });
        }

        // Render List
        function renderList(data) {
            centersList.innerHTML = '';

            if (data.length === 0) {
                centersList.innerHTML = `
                <div class="empty-state">
                    <p>No centers found matching your search.</p>
                </div>
            `;
                resultsInfo.textContent = 'No results found';
                return;
            }

            resultsInfo.textContent = `Showing ${data.length} center${data.length !== 1 ? 's' : ''}`;

            // Limit rendering for performance if needed, but 893 is manageable
            // We'll render all but could implement virtualization if list grows huge.
            const fragment = document.createDocumentFragment();

            data.forEach(item => {
                const el = document.createElement('div');
                el.className = 'center-item';

                // Use Lat/Lng if available or fallback to address
                const destination = (item.lat && item.lng)
                    ? `${item.lat},${item.lng}`
                    : escapeHtml(`${item.centre_name}, ${item.town}, ${item.state}`);

                el.innerHTML = `
                <div class="center-name">${highlightText(item.centre_name, searchInput.value)}</div>
                <div class="center-location">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    ${item.town}, ${item.state}
                </div>
                <div class="actions">
                    <button class="btn btn-primary" onclick="getDirections('${destination}')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
                        Directions
                    </button>
                    <!-- Note: Map Zoom not fully supported by embedded MyMaps without coords -->
                </div>
            `;
                el.addEventListener('click', (e) => {
                    // Determine if button was clicked
                    if (!e.target.closest('.btn')) {
                        // Highlight logic or "Show on Map" tooltip
                        document.querySelectorAll('.center-item').forEach(i => i.classList.remove('active'));
                        el.classList.add('active');
                    }
                });
                fragment.appendChild(el);
            });

            centersList.appendChild(fragment);
        }

        // Filter Logic
        function filterData() {
            const query = searchInput.value.toLowerCase().trim();
            const state = stateFilter.value;

            filteredData = rawData.filter(item => {
                const matchesSearch =
                    item.centre_name.toLowerCase().includes(query) ||
                    item.town.toLowerCase().includes(query);
                const matchesState = state === "" || item.state === state;

                return matchesSearch && matchesState;
            });

            renderList(filteredData);
        }

        // Helper: Highlight Text
        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Directions
        window.getDirections = function (destination) {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        // Open Google Maps Directions
                        const url = `https://www.google.com/maps/dir/${lat},${lng}/${encodeURIComponent(destination)}`;
                        window.open(url, '_blank');
                    },
                    (error) => {
                        // Fallback if location denied
                        // Just open map with destination, user can manually type start
                        const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(destination)}`;
                        window.open(url, '_blank');
                    }
                );
            } else {
                const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(destination)}`;
                window.open(url, '_blank');
            }
        };

        // Share
        window.shareApp = function () {
            if (navigator.share) {
                navigator.share({
                    title: '2025 JAMB Centers',
                    text: 'Find your nearest JAMB registration center.',
                    url: window.location.href,
                }).catch(console.error);
            } else {
                alert('Share this link: ' + window.location.href);
            }
        }

        // Event Listeners
        function setupEventListeners() {
            searchInput.addEventListener('input', filterData);
            stateFilter.addEventListener('change', filterData);
        }

        // Start
        init();

    </script>
